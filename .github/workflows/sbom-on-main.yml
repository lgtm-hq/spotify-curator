---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
      egress-policy: block
      egress-preset: sbom
    permissions:
      # write: attach SBOM to release assets (required by reusable-sbom job
      # permissions; also covers repository checkout)
      contents: write
      # write: upload vulnerability findings to the Security tab
      security-events: write
      # write: OIDC token for SBOM attestation signing
      id-token: write
      # write: publish SBOM attestations
      attestations: write
