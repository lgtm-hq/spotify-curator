---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@1c0efb61622a0e6827cfa0baaa4ca84514abe6ca # v0.83.10
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '1c0efb61622a0e6827cfa0baaa4ca84514abe6ca' # v0.83.10
      egress-policy: block
      egress-preset: sbom
    permissions:
      # write: attach SBOM to release assets (required by reusable-sbom job
      # permissions; also covers repository checkout)
      contents: write
      # write: upload vulnerability findings to the Security tab
      security-events: write
      # write: OIDC token for SBOM attestation signing
      id-token: write
      # write: publish SBOM attestations
      attestations: write
