---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: sbom
    permissions:
      # write: attach SBOM to release assets (required by reusable-sbom job
      # permissions; also covers repository checkout)
      contents: write
      # write: upload vulnerability findings to the Security tab
      security-events: write
      # write: OIDC token for SBOM attestation signing
      id-token: write
      # write: publish SBOM attestations
      attestations: write
