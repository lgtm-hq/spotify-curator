---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@eed6717a5508d2180e4749969b454b969feea69c # v0.83.7
    with:
      tooling-ref: 'eed6717a5508d2180e4749969b454b969feea69c' # v0.83.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
