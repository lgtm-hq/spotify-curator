---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e # v0.83.2
    with:
      tooling-ref: '7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e' # v0.83.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
