---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@e119ddbc8ba1fe611ed10163b2b2748d5148ab6a # v0.83.12
    with:
      tooling-ref: 'e119ddbc8ba1fe611ed10163b2b2748d5148ab6a' # v0.83.12
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
