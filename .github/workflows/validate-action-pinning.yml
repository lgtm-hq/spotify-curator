---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
