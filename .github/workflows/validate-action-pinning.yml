---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@1c0efb61622a0e6827cfa0baaa4ca84514abe6ca # v0.83.10
    with:
      tooling-ref: '1c0efb61622a0e6827cfa0baaa4ca84514abe6ca' # v0.83.10
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
