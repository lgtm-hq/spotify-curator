---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@1fac81deb64724d738339b0aa3809ece0ba26de9 # v0.83.6
    with:
      tooling-ref: '1fac81deb64724d738339b0aa3809ece0ba26de9' # v0.83.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
