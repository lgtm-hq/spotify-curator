---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
