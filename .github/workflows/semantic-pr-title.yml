---
name: PR - Title Validation
# Validates PR titles follow Conventional Commits format.

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-spotify-curator): semantic-title / 📝 Validate PR Title
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@eed6717a5508d2180e4749969b454b969feea69c # v0.83.7
    with:
      job-name: '📝 Validate PR Title'
      tooling-ref: 'eed6717a5508d2180e4749969b454b969feea69c' # v0.83.7
      egress-policy: block
      egress-preset: github-tooling
      comment-marker: '<!-- semantic-pr-title -->'
    permissions:
      contents: read
      pull-requests: write
