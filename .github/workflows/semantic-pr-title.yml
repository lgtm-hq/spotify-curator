---
name: PR - Title Validation
# Validates PR titles follow Conventional Commits format.

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-spotify-curator): semantic-title / 📝 Validate PR Title
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@c40cd60334b5b5f2952e1af99e2e083be50c1620 # v0.80.0
    with:
      job-name: '📝 Validate PR Title'
      tooling-ref: 'c40cd60334b5b5f2952e1af99e2e083be50c1620' # v0.80.0
      egress-policy: block
      egress-preset: github-tooling
      comment-marker: '<!-- semantic-pr-title -->'
    permissions:
      contents: read
      pull-requests: write
