---
name: Security - CodeQL Code Scanning

'on':
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', 'frontend/**', '.github/**']
  pull_request:
    branches: [main, wip/v0-prototype]
    # No paths filter: `codeql / 🔬 CodeQL Analysis` is a required status
    # check, and a path-filtered workflow that does not run leaves that
    # context absent (not skipped), which permanently blocks PRs and
    # merge-queue entries that touch only non-matching files
    # (workflow-contract § Required-check-safe conditional workflows).
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      # Org ruleset (checks-spotify-curator): codeql / 🔬 CodeQL Analysis
      job-name: '🔬 CodeQL Analysis'
      # actions only for now: main has no app code yet (the prototype lives
      # on wip/v0-prototype until the port epics land), and CodeQL hard-fails
      # a language with zero source files ("no source code seen"). Expand to
      # python,javascript-typescript with the first port PR — tracked in #44.
      languages: actions
      build-mode: none
      category: '/language:all'
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
      egress-policy: block
      egress-preset: github-tooling
      # Full list (replace semantics): the reusable passes allowed-endpoints
      # verbatim to step-security/harden-runner, so a non-empty value must
      # include the github-tooling baseline. release-assets is needed because
      # the CodeQL bundle download from github/codeql-action releases
      # redirects there (py-lintro/Rustume reference-consumer pattern).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    permissions:
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write
