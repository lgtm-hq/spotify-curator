---
name: CI - Frontend

'on':
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    branches: [main, wip/v0-prototype]
    types: [opened, synchronize, reopened, ready_for_review]
    # frontend/** only (not this workflow file): main has no frontend/ yet —
    # the SPA lives on wip/v0-prototype until the port epics land — so a
    # self-trigger on the workflow file alone can only fail on cd frontend.
    paths: ['frontend/**']
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-custom.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      package-manager: bun
      working-directory: frontend
      # oxlint then a production type-check + build; && short-circuits so a
      # lint failure also fails the job. No test runner exists yet.
      test-command: 'bun run lint && bun run build'
      coverage: false
      publish-test-summary: false
      job-name: Frontend Checks
      node-version: '22'
      draft-pr-skip: true
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
      # audit (not block) for now: no ready egress preset covers the node/bun
      # install registries. Tighten to block with an explicit allowlist later.
      egress-policy: audit
    permissions:
      actions: write
      contents: read
      pull-requests: write
