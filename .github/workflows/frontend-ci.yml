---
name: CI - Frontend

'on':
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/ci/frontend-presence.sh'
      - 'tests/frontend-presence.sh'
  pull_request:
    branches: [main, wip/v0-prototype]
    types: [opened, synchronize, reopened, ready_for_review]
    # Main has no frontend yet; the presence job also runs on wiring changes.
    # Once the prototype lands, its checks run normally, including merge_group.
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/ci/frontend-presence.sh'
      - 'tests/frontend-presence.sh'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend-presence:
    name: Frontend Presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      present: ${{ steps.presence.outputs.present }}
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test presence detection
        run: bash tests/frontend-presence.sh
      - name: Detect frontend workdir
        id: presence
        run: bash scripts/ci/frontend-presence.sh >> "$GITHUB_OUTPUT"

  frontend:
    needs: frontend-presence
    # A missing manifest in an existing directory must still fail frontend CI.
    if: needs.frontend-presence.outputs.present == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-custom.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    with:
      package-manager: bun
      working-directory: frontend
      # oxlint then a production type-check + build; && short-circuits so a
      # lint failure also fails the job. No test runner exists yet.
      test-command: 'bun run lint && bun run build'
      coverage: false
      publish-test-summary: false
      job-name: Frontend Checks
      node-version: '22'
      draft-pr-skip: true
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      # audit (not block) for now: no ready egress preset covers the node/bun
      # install registries. Tighten to block with an explicit allowlist later.
      egress-policy: audit
    permissions:
      actions: write
      contents: read
      pull-requests: write
