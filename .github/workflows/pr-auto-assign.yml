---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@1c0efb61622a0e6827cfa0baaa4ca84514abe6ca # v0.83.10
    with:
      job-name: '👤 Auto Assign PR Author'
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '1c0efb61622a0e6827cfa0baaa4ca84514abe6ca' # v0.83.10
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
