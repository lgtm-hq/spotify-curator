---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e # v0.83.2
    with:
      job-name: '👤 Auto Assign PR Author'
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e' # v0.83.2
      egress-policy: block
      egress-preset: github-tooling
      runner-image: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
