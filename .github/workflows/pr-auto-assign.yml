---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@c40cd60334b5b5f2952e1af99e2e083be50c1620 # v0.80.0
    with:
      job-name: '👤 Auto Assign PR Author'
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'c40cd60334b5b5f2952e1af99e2e083be50c1620' # v0.80.0
      egress-policy: block
      egress-preset: github-tooling
      runner-image: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
