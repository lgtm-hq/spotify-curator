---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      job-name: '👤 Auto Assign PR Author'
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
