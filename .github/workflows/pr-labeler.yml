---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
