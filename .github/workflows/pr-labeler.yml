---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e # v0.83.2
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e' # v0.83.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
