---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@e119ddbc8ba1fe611ed10163b2b2748d5148ab6a # v0.83.12
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'e119ddbc8ba1fe611ed10163b2b2748d5148ab6a' # v0.83.12
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
