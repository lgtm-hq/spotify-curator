---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@1c0efb61622a0e6827cfa0baaa4ca84514abe6ca # v0.83.10
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '1c0efb61622a0e6827cfa0baaa4ca84514abe6ca' # v0.83.10
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
