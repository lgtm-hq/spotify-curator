---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@eed6717a5508d2180e4749969b454b969feea69c # v0.83.7
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'eed6717a5508d2180e4749969b454b969feea69c' # v0.83.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
