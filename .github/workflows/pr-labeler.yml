---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
